  <div class="page-intro">
    <h1>Art</h1>
    <p>Twenty works on coffee, labor, climate, and memory.</p>
  </div>

  <section class="section">
    <div class="section-head"><h2>Works</h2><span class="role">Pencil · Conte · Acrylic · Digital</span></div>
    <p class="art-hint">Tap a work to flip it over and read about it.</p>
    <div class="gallery rows art-gallery">
      <div class="row">
        <figure class="ph art-card" style="--r:0.782" data-n="01">
          <button type="button" class="art-flip" aria-haspopup="dialog" aria-label="Flip over Bound by Value"><img src="images/art/01.jpg" alt="Bound by Value" loading="lazy"><span class="fc"><b>01</b> Bound by Value</span><span class="flip-badge" aria-hidden="true">↻</span></button>
          <figcaption class="art-info"><h3>Bound by Value</h3><p class="meta">Pencil on paper · 36 × 50 cm</p><p>The convenience we enjoy every day cannot be pulled apart from its environmental cost. We use products that make life easier but rarely stop to consider the materials, the shipping, and the waste that become a burden on the environment. This still-life drawing arranges everyday objects with a rope winding around them, symbolizing the inseparable relationship of the objects bound together. Even one ordinary object is tied into a much larger system. Through the drawing I wanted to ask what price convenience is built on and make an everyday act like consumption look different than it usually does.</p></figcaption>
        </figure>
        <figure class="ph art-card" style="--r:0.733" data-n="02">
          <button type="button" class="art-flip" aria-haspopup="dialog" aria-label="Flip over A Forecast of Fear"><img src="images/art/02.jpg" alt="A Forecast of Fear" loading="lazy"><span class="fc"><b>02</b> A Forecast of Fear</span><span class="flip-badge" aria-hidden="true">↻</span></button>
          <figcaption class="art-info"><h3>A Forecast of Fear</h3><p class="meta">Pencil on paper · 34 × 51 cm</p><p>At first the climate crisis felt like something happening far away. Once I understood that heat waves, wildfires, floods, and droughts cut into what farms and fisheries produce, threaten livelihoods, and push up the cost of living, I realized how close the problem is to my life. This piece came from two feelings at once: anxiety about the future climate and a desire to understand and study the problem. The crisis runs through the global economy and food, not just nature. What I wanted to express is a hope that we are not too late to change things.</p></figcaption>
        </figure>
        <figure class="ph art-card" style="--r:1.444" data-n="03">
          <button type="button" class="art-flip" aria-haspopup="dialog" aria-label="Flip over Hands Behind the Harvest"><img src="images/art/03.jpg" alt="Hands Behind the Harvest" loading="lazy"><span class="fc"><b>03</b> Hands Behind the Harvest</span><span class="flip-badge" aria-hidden="true">↻</span></button>
          <figcaption class="art-info"><h3>Hands Behind the Harvest</h3><p class="meta">Conte on black paper · 49 × 34 cm</p><p>There is always an invisible cost that someone else is bearing behind the cheap price of coffee. The two hands against a dark background symbolize the traces of endless labor and exploitation. Every cherry we drink is harvested by someone&#x27;s hands, yet that labor disappears inside the finished product; in the worst conditions, workers even supply their own gloves. Rather than letting coffee stay a commodity, the work asks us to see the lives that produce it. By imagining the lives of the laborer, I sought to reveal forced labor that still exists within the modern supply chain.</p></figcaption>
        </figure>
        <figure class="ph art-card" style="--r:1.422" data-n="04">
          <button type="button" class="art-flip" aria-haspopup="dialog" aria-label="Flip over A Story Without a Face"><img src="images/art/04.jpg" alt="A Story Without a Face" loading="lazy"><span class="fc"><b>04</b> A Story Without a Face</span><span class="flip-badge" aria-hidden="true">↻</span></button>
          <figcaption class="art-info"><h3>A Story Without a Face</h3><p class="meta">Conte on black paper · 52 × 35 cm</p><p>An exploitative system erases an individual and treats them nothing more than an invisible laborer. This drawing started from a worker on a coffee farm describing how he ended up there. I left his face out deliberately: he tells his story, yet his face and name stay unseen, treated as anonymous labor rather than a person. Rather than drawing his face, I focused on his worn clothing and sun-darkened skin that mark the years of hard labor and poor condition. Behind coffee, a casually consumed product worldwide, are people who never had a real choice over their work.</p></figcaption>
        </figure>
      </div>
      <div class="row">
        <figure class="ph art-card" style="--r:1.296" data-n="05">
          <button type="button" class="art-flip" aria-haspopup="dialog" aria-label="Flip over Archive of a Vanished Labor"><img src="images/art/05.jpg" alt="Archive of a Vanished Labor" loading="lazy"><span class="fc"><b>05</b> Archive of a Vanished Labor</span><span class="flip-badge" aria-hidden="true">↻</span></button>
          <figcaption class="art-info"><h3>Archive of a Vanished Labor</h3><p class="meta">Watercolor, pencil, brown paper on wooden board · 53 × 41 cm</p><p>A boy is drying coffee beans on a coffee farm in Africa, a child in a workplace at an age when he should be in school. I wanted to imagine a future where this no longer happens. After finishing the drawing, I rubbed the piece with sandpaper, deliberately wearing the image away so it reads like an old document preserved in a museum. Though I erased the strokes, what I truly want to eliminate is the unjust reality itself. One day I wish that this scene would be old historical material that witnessed child labor. The damage to the work is not destruction but hope for the future.</p></figcaption>
        </figure>
        <figure class="ph art-card" style="--r:1.222" data-n="06">
          <button type="button" class="art-flip" aria-haspopup="dialog" aria-label="Flip over Where Childhood Labors"><img src="images/art/06.jpg" alt="Where Childhood Labors" loading="lazy"><span class="fc"><b>06</b> Where Childhood Labors</span><span class="flip-badge" aria-hidden="true">↻</span></button>
          <figcaption class="art-info"><h3>Where Childhood Labors</h3><p class="meta">Acrylic on canvas · 60 × 50 cm</p><p>Child labor in the coffee industry is not the problem of one place but a structure that runs across regions. This painting shows a girl harvesting cherries straight from a coffee plant in Honduras, the first of a three-part series set in Africa, Central and South America, and Southeast Asia, following the path a coffee bean takes through a child&#x27;s hands. Coffee farms are often deeply entangled with poverty, inequality, and the labor of children who should be protected. The girl in this scene is not read as one individual and stands for the countless nameless children too widespread to dismiss as a single tragedy.</p></figcaption>
        </figure>
        <figure class="ph art-card" style="--r:0.856" data-n="07">
          <button type="button" class="art-flip" aria-haspopup="dialog" aria-label="Flip over Harvested Childhood"><img src="images/art/07.jpg" alt="Harvested Childhood" loading="lazy"><span class="fc"><b>07</b> Harvested Childhood</span><span class="flip-badge" aria-hidden="true">↻</span></button>
          <figcaption class="art-info"><h3>Harvested Childhood</h3><p class="meta">Acrylic on canvas · 45 × 53 cm</p><p>The second work in the series shows a young boy carrying harvested cherries on a farm in Latin America. He already holds one large basket, yet balances a second on his head. The basket is the key symbol: not just a tool but a production logic imposed even on a child, measured in how much can be moved, how fast, and how often. The weight bearing down on his small frame is more than physical; it is the social weight shifted onto him. The piece denounces the structure of exploitation, sacrificing a young child who must be protected and cared for.</p></figcaption>
        </figure>
        <figure class="ph art-card" style="--r:0.856" data-n="08">
          <button type="button" class="art-flip" aria-haspopup="dialog" aria-label="Flip over The Quiet Burden"><img src="images/art/08.jpg" alt="The Quiet Burden" loading="lazy"><span class="fc"><b>08</b> The Quiet Burden</span><span class="flip-badge" aria-hidden="true">↻</span></button>
          <figcaption class="art-info"><h3>The Quiet Burden</h3><p class="meta">Acrylic on canvas · 45 × 53 cm</p><p>The final work in the series shows a girl from an ethnic minority in Laos sorting coffee beans, the last stage after harvesting and carrying. On the surface the scene is the quietest of the three: still, patient, and repetitive. But behind her calm hands are conditions handed to her with no other choice. She works not because she or her family decided it but because the circumstances left no alternative. This system is a problem that cannot be reduced to one individual&#x27;s responsibility. We must question the reality of how easily a young life is placed in a vulnerable position within socioeconomic structures.</p></figcaption>
        </figure>
      </div>
      <div class="row">
        <figure class="ph art-card" style="--r:0.851" data-n="09">
          <button type="button" class="art-flip" aria-haspopup="dialog" aria-label="Flip over The Cup I Love"><img src="images/art/09.jpg" alt="The Cup I Love" loading="lazy"><span class="fc"><b>09</b> The Cup I Love</span><span class="flip-badge" aria-hidden="true">↻</span></button>
          <figcaption class="art-info"><h3>The Cup I Love</h3><p class="meta">Acrylic on canvas · 45 × 53 cm</p><p>This acrylic painting shows me making coffee at a cafe. I have explored the underside of coffee labor, but coffee is also something I have loved for a long time. What draws me most is the aroma that comes through: coffee arrives bitter and strong, then acidity, sweetness, and a lingering finish layer into a complex sensation. Making a cup is almost a personal ritual of concentration. Because I love coffee, I began asking where my cup came from and whose hands it passed through. In that sense, this work expresses my affection for coffee and the starting point that led me to explore the coffee industry.</p></figcaption>
        </figure>
        <figure class="ph art-card" style="--r:0.852" data-n="10">
          <button type="button" class="art-flip" aria-haspopup="dialog" aria-label="Flip over More Than a Bean"><img src="images/art/10.jpg" alt="More Than a Bean" loading="lazy"><span class="fc"><b>10</b> More Than a Bean</span><span class="flip-badge" aria-hidden="true">↻</span></button>
          <figcaption class="art-info"><h3>More Than a Bean</h3><p class="meta">Acrylic on canvas · 45 × 53 cm</p><p>Learning how coffee is made deepened my love for it and transformed it into understanding. For a long time I just enjoyed the aroma and taste of coffee. But studying all of the factors needed before a single bean is harvested (the right temperature, rainfall, soil, altitude, shade, time, and the farmer&#x27;s constant care) changed how I see a cup of coffee entirely. Something I had taken for granted turned out to be a result only possible through a combination of nature and skill. The more I learned about coffee, the more I wanted to value the time and effort that goes into a single bean.</p></figcaption>
        </figure>
        <figure class="ph art-card" style="--r:1.181" data-n="11">
          <button type="button" class="art-flip" aria-haspopup="dialog" aria-label="Flip over From Forest to Cup"><img src="images/art/11.jpg" alt="From Forest to Cup" loading="lazy"><span class="fc"><b>11</b> From Forest to Cup</span><span class="flip-badge" aria-hidden="true">↻</span></button>
          <figcaption class="art-info"><h3>From Forest to Cup</h3><p class="meta">Acrylic on canvas · 53 × 45 cm</p><p>The traditional way of roasting coffee in Africa led me to trace the origin of coffee. Arabica coffee originated in the forests of Ethiopia. From there it crossed the Red Sea to Yemen, where Sufi communities drank it to stay awake. Over time coffee spread through Mecca, Cairo, and Istanbul. After studying the history, I could no longer view the act of roasting as merely heating beans. The traditional process has centuries of human experience and a relationship with nature. The fire and hands of this piece connect a modern café coffee to a far older time, showing how much history sits inside it.</p></figcaption>
        </figure>
        <figure class="ph art-card" style="--r:0.853" data-n="12">
          <button type="button" class="art-flip" aria-haspopup="dialog" aria-label="Flip over Rising Grounds"><img src="images/art/12.jpg" alt="Rising Grounds" loading="lazy"><span class="fc"><b>12</b> Rising Grounds</span><span class="flip-badge" aria-hidden="true">↻</span></button>
          <figcaption class="art-info"><h3>Rising Grounds</h3><p class="meta">Acrylic on canvas · 45 × 53 cm</p><p>Coffee is a crop that can be grown stably only when certain conditions are met. However, rising temperatures are pushing coffee farms upward. As established regions grow too hot and unstable, farmers have little choice but to climb to cooler, higher ground to keep producing. This situation is more than a farming problem. It shows how climate change unsettles daily life and production. Behind a familiar cup sit the climate crisis and the anxiety of producers adapting to it. It proves that one small product, and ultimately our lives, is closely connected to the global environment.</p></figcaption>
        </figure>
      </div>
      <div class="row">
        <figure class="ph art-card" style="--r:1.216" data-n="13">
          <button type="button" class="art-flip" aria-haspopup="dialog" aria-label="Flip over What We Are About to Lose"><img src="images/art/13.jpg" alt="What We Are About to Lose" loading="lazy"><span class="fc"><b>13</b> What We Are About to Lose</span><span class="flip-badge" aria-hidden="true">↻</span></button>
          <figcaption class="art-info"><h3>What We Are About to Lose</h3><p class="meta">Acrylic on canvas · 60 × 50 cm</p><p>There is no single reason a coffee tree dries out, but drought and extreme heat can give severe stress. It closes its stomata, slowing the growth, and leaves wilt and drop. The FAO has pointed out drought-driven yield losses and the shrinking of land suitable for coffee. The brown, withering leaves show a warning that consumption and climate change are not separate problems. The drying tree stands for the future of coffee growing more vulnerable to the climate crisis. I hope that this work makes the viewer think of the natural environment. To keep the coffee I love, we must protect the earth it depends on as well.</p></figcaption>
        </figure>
        <figure class="ph art-card" style="--r:1.222" data-n="14">
          <button type="button" class="art-flip" aria-haspopup="dialog" aria-label="Flip over After the Last Tree"><img src="images/art/14.jpg" alt="After the Last Tree" loading="lazy"><span class="fc"><b>14</b> After the Last Tree</span><span class="flip-badge" aria-hidden="true">↻</span></button>
          <figcaption class="art-info"><h3>After the Last Tree</h3><p class="meta">Acrylic on canvas · 60 × 50 cm</p><p>The barren land lost its life to extreme drought and heat: cracked ground, leafless trees, a red murky sky, and dry stumps left where life once was. It widens the coffee-and-climate relationship I have been exploring into a broader ecological view. The crisis of coffee points to how delicate of a balance the whole environment rests on. I removed all human figures, but such absence does not mean their influence is gone. Often only the consequences of human action stay in nature. If we keep consuming the environment as a given, we may someday see only its traces instead of a living landscape.</p></figcaption>
        </figure>
        <figure class="ph art-card" style="--r:0.814" data-n="15">
          <button type="button" class="art-flip" aria-haspopup="dialog" aria-label="Flip over The Climate in a Cup"><img src="images/art/15.jpg" alt="The Climate in a Cup" loading="lazy"><span class="fc"><b>15</b> The Climate in a Cup</span><span class="flip-badge" aria-hidden="true">↻</span></button>
          <figcaption class="art-info"><h3>The Climate in a Cup</h3><p class="meta">Acrylic on canvas · 50 × 60 cm</p><p>The climate crisis has subtly but quickly changed the environment, and now these changes are experienced inside human life. Global warming is unsettling all of the natural conditions as we knew them. We are observing more extreme climate phenomena that connect to a crisis of the atmosphere, water cycle, biodiversity, and food production. The half-filled cup symbolizes the unstable future of coffee; the wildfire behind looks distant but is slowly and steadily approaching the table. By juxtaposing the fire and the cup, I wanted to show that the collapse of the global environment is already seeping into human daily life and consumption culture.</p></figcaption>
        </figure>
        <figure class="ph art-card" style="--r:0.75" data-n="16">
          <button type="button" class="art-flip" aria-haspopup="dialog" aria-label="Flip over One Last Laugh"><img src="images/art/16.jpg" alt="One Last Laugh" loading="lazy"><span class="fc"><b>16</b> One Last Laugh</span><span class="flip-badge" aria-hidden="true">↻</span></button>
          <figcaption class="art-info"><h3>One Last Laugh</h3><p class="meta">Digital art · 3024 × 4032 px</p><p>The moment of playing Gartic Phone with friends on the last day of the YYGS program is a memory I treasure. Living together briefly, I had grown close to people from different backgrounds, and the laughter over that game stuck with me most. Briefly forgetting the farewell, we were immersed in the joy. Rather than leaving the photo as an ordinary keepsake, I layered patterns and lines to sharpen the energy of the memory. The repeating marks stand for the talk and laughter and how fast that day slipped by. This work records how an ending can turn a stretch of time into the most vivid memory.</p></figcaption>
        </figure>
      </div>
      <div class="row">
        <figure class="ph art-card" style="--r:0.839" data-n="17">
          <button type="button" class="art-flip" aria-haspopup="dialog" aria-label="Flip over The Excitement of Arrival"><img src="images/art/17.jpg" alt="The Excitement of Arrival" loading="lazy"><span class="fc"><b>17</b> The Excitement of Arrival</span><span class="flip-badge" aria-hidden="true">↻</span></button>
          <figcaption class="art-info"><h3>The Excitement of Arrival</h3><p class="meta">Digital art · 3377 × 4026 px</p><p>On one Thanksgiving break, I went on a trip to Osaka with seven friends. This piece maximizes the anticipation and friendship we felt right after we reached Namba Station. Rather than a mere reproduction of the place, I shifted the color mood, replaced the detail with patterns, and added lines for movement. A moment of travel is emotionally rebuilt in memory. The excitement of taking in a new city had us keyed up from the start. This artwork records the flutter of arrival and the young energy of that moment becoming sharper.</p></figcaption>
        </figure>
        <figure class="ph art-card" style="--r:0.75" data-n="18">
          <button type="button" class="art-flip" aria-haspopup="dialog" aria-label="Flip over Shared Steps"><img src="images/art/18.jpg" alt="Shared Steps" loading="lazy"><span class="fc"><b>18</b> Shared Steps</span><span class="flip-badge" aria-hidden="true">↻</span></button>
          <figcaption class="art-info"><h3>Shared Steps</h3><p class="meta">Digital art · 2316 × 3088 px</p><p>This is a friend I met through volunteering with Nanoom Korea. As we met and walked together every week, we formed emotional rapport through an ordinary walk. To highlight the intimacy, I shifted the scene toward how it feels in memory using a gradient map and layered white silhouettes behind the two of us at the center. The overlapping traces turned the moment into a scene where feeling lingers. Volunteering does not always have to be &quot;a dramatic narrative you do for someone.&quot; Sometimes it may suffice as a way of understanding each other and being present together.</p></figcaption>
        </figure>
        <figure class="ph art-card" style="--r:0.75" data-n="19">
          <button type="button" class="art-flip" aria-haspopup="dialog" aria-label="Flip over In the Light of Nam June Paik"><img src="images/art/19.jpg" alt="In the Light of Nam June Paik" loading="lazy"><span class="fc"><b>19</b> In the Light of Nam June Paik</span><span class="flip-badge" aria-hidden="true">↻</span></button>
          <figcaption class="art-info"><h3>In the Light of Nam June Paik</h3><p class="meta">Digital art · 2316 × 3088 px</p><p>Standing before Nam June Paik&#x27;s &quot;The More The Better&quot; at the MMCA Gwacheon, I felt genuinely overwhelmed by the repetition of light across all those monitors and the sheer scale. It was a moment of directly sensing how technology and art together can expand what a viewer can perceive. I wanted to reinterpret that energy digitally, overlapping patterns to recreate the flicker of the LED screens and adding loose lines for depth. To me the piece marks how I came to understand the language of contemporary art. It also points to what Paik opened up: that technology can stir the senses rather than stay a cold machine.</p></figcaption>
        </figure>
        <figure class="ph art-card" style="--r:1.333" data-n="20">
          <button type="button" class="art-flip" aria-haspopup="dialog" aria-label="Flip over The Mathematics of Movement"><img src="images/art/20.jpg" alt="The Mathematics of Movement" loading="lazy"><span class="fc"><b>20</b> The Mathematics of Movement</span><span class="flip-badge" aria-hidden="true">↻</span></button>
          <figcaption class="art-info"><h3>The Mathematics of Movement</h3><p class="meta">Digital art · 4032 × 3024 px</p><p>Visualizing the &quot;rate of change&quot; in calculus through bodies on a staircase for an English project; this was a refreshing moment of learning an abstract concept through an unexpected way. I inverted the colors for intensity and outlined the figures to highlight this odd but intriguing experience. I had my friends climb the stairs, an evenly repeating unit, at different intervals (one step at a time, or several at once) so each movement stands for a different rate. Friends climbing at different speeds showed that change does not always happen the same way. This piece records an experiment in converting an abstract concept into an experience of space and motion.</p></figcaption>
        </figure>
      </div>
    </div>
